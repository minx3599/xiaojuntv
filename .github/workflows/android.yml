name: Android build

on:
  push:
    branches: ["feature/ui", "main"]
  pull_request:
    branches: ["feature/ui", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android TV and Android 4.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew :tv:assembleOriginalDebug :tv-legacy:assembleDebug --stacktrace

      - name: Upload Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaojuntv-android-tv-debug
          path: tv/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload Android 4.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaojuntv-android-4.3-debug
          path: tv-legacy/build/outputs/apk/**/*.apk
          if-no-files-found: error
